[package]
name = "voicecore"
version = "0.1.1"
edition = "2021"
authors = ["Dotan Cohen"]
license = "GPL-3.0"
repository = "https://github.com/dotancohen/voicecore"
description = "Core library for Voice note-taking application family."

[lib]
name = "voicecore"
crate-type = ["rlib", "cdylib"]

[features]
default = ["server", "desktop", "file-storage"]
# Server components (axum, tower) - not needed on mobile
server = ["dep:axum", "dep:axum-server", "dep:tower", "dep:tower-http", "dep:tokio-util"]
# Desktop features (hostname detection, config dir detection)
desktop = ["dep:hostname", "dep:dirs"]
# UniFFI bindings for mobile (Android/iOS)
uniffi = ["dep:uniffi"]
# Cloud file storage (S3 and S3-compatible services)
# rust-s3 0.37+ uses reqwest with bundled webpki roots, so the same
# implementation works on desktop and Android.
file-storage = ["dep:rust-s3"]

[dependencies]
# Async runtime - use lighter features for mobile
tokio = { version = "1.42", features = ["rt", "sync", "time", "macros", "fs"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "blob", "backup"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID
uuid = { version = "1.11", features = ["v7", "v4", "serde"] }

# HTTP client - base config (TLS features added per-platform below)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

# Cloud storage (optional - file-storage feature)
# rust-s3 is much lighter than aws-sdk-s3 and needs no native C build.
# Must be >= 0.37: earlier versions load TLS roots from the OS certificate
# directory, which does not exist on Android, so every S3 request failed there.
rust-s3 = { version = "0.37.2", default-features = false, features = ["tokio-rustls-tls"], optional = true }

# HTTP server (optional - server feature)
axum = { version = "0.7", features = ["json"], optional = true }
# HTTPS for the server; the crypto provider is the one rustls is built with below
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
# Streaming a recording in and out of the server without holding it in memory
tokio-util = { version = "0.7", features = ["io"], optional = true }

# TLS - base config (crypto backend added per-platform below)
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = "2.0"
sha2 = "0.10"
rcgen = "0.13"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Text merging
diffy = "0.4"
similar = "2.6"

# Hostname (optional - desktop feature)
hostname = { version = "0.4", optional = true }

# Directory paths (optional - desktop feature)
dirs = { version = "5.0", optional = true }

# Streams (the client streams a recording to and from a peer)
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Free space on a disk, before a file is written
fs4 = "0.13"
# The addresses this machine listens on, for the code and the card
if-addrs = "0.13"

# Base64
base64 = "0.22"

# URL encoding
urlencoding = "2.1"

# UniFFI for mobile bindings (optional)
uniffi = { version = "0.28", features = ["cli"], optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]

[dev-dependencies]
tempfile = "3.14"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

# =============================================================================
# Platform-specific TLS backends
# =============================================================================

# Desktop (Linux, macOS, Windows): use aws-lc (default, better performance)
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }

# Android: use ring (better cross-compilation support). "rustls-tls" bundles the
# Mozilla root certificates, which Android does not expose to rustls otherwise.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
